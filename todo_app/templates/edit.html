<!DOCTYPE html>
<html>
<head>
    <title>Редактировать задачу</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: #f0f0f0; }
        h1 { color: blue; }
        input, button { padding: 8px; margin: 5px; }
        .message { color: green; }
        .save-btn { background-color: #4CAF50; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .cancel-btn { background-color: #999; color: white; text-decoration: none; padding: 8px 12px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Редактирование задачи</h1>
    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}
    <form method="POST">
        <input type="text" name="task" value="{{ task.text }}" required>
        <button type="submit" class="save-btn">💾 Сохранить</button>
        <a href="/" class="cancel-btn">Отмена</a>
    </form>
</body>
</html>
