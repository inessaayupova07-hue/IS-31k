<!DOCTYPE html>
<html>
<head>
    <title>Список дел</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: #f0f0f0; }
        h1 { color: blue; }
        ul { list-style: none; padding: 0; }
        li { margin: 10px 0; background: white; padding: 10px; border-radius: 8px; }
        .edit-btn { background-color: #4CAF50; color: white; text-decoration: none; padding: 2px 8px; border-radius: 4px; margin-left: 10px; }
        .delete-btn { background-color: #ff4444; color: white; text-decoration: none; padding: 2px 8px; border-radius: 4px; margin-left: 10px; }
        .add-btn { background-color: #4CAF50; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .clear-btn { background-color: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Мои задачи</h1>
    {% if tasks %}
        <ul>
            {% for task in tasks %}
                <li>
                    {{ task.text }} — <small>{{ task.date }}</small>
                    <a href="/edit/{{ loop.index0 }}" class="edit-btn">✏ Редактировать</a>
                    <a href="/delete/{{ loop.index0 }}" class="delete-btn">🗑 Удалить</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Нет задач. Добавьте первую!</p>
    {% endif %}
    <h2>Добавить задачу</h2>
    <form method="POST" action="/add">
        <input type="text" name="task" placeholder="Новая задача" required>
        <button type="submit" class="add-btn">Добавить</button>
    </form>
    <form method="POST" action="/clear">
        <button type="submit" class="clear-btn">Очистить всё</button>
    </form>
</body>
</html>
