<!DOCTYPE html>
<html>
<head>
    <title>Список дел</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background-color: #f0f0f0;
        }
        h1 {
            color: blue;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            padding: 8px;
            background-color: white;
            border-radius: 5px;
        }
        .delete-btn {
            background-color: #ff4444;
            color: white;
            text-decoration: none;
            padding: 2px 8px;
            border-radius: 3px;
            margin-left: 10px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background-color: #cc0000;
        }
        .clear-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 20px;
        }
        .add-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        input[type="text"] {
            padding: 5px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Мои задачи</h1>

    <ul>
        {% for task in tasks %}
            <li>
                <strong>{{ task.text }}</strong>
                <small style="color:gray;">({{ task.date }})</small>
                <a href="/delete/{{ loop.index0 }}" class="delete-btn">Удалить</a>
            </li>
        {% endfor %}
    </ul>

    <h2>Добавить задачу</h2>
    <form method="POST" action="/add">
        <input type="text" name="task" placeholder="Новая задача" required>
        <button type="submit" class="add-btn">Добавить</button>
    </form>

    <form method="POST" action="/clear">
        <button type="submit" class="clear-btn">Очистить всё</button>
    </form>
</body>
</html>
